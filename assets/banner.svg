<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.12); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes pulseDot {
      0%, 100% { r: 3.5px; opacity: 0.6; }
      50% { r: 5.5px; opacity: 1; }
    }
    .orb-anim1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 1000px 80px; }
    .orb-anim2 { animation: pulseOrb 10s ease-in-out infinite 3s; transform-origin: 150px 300px; }
    .card1-anim { animation: floatCard1 6s ease-in-out infinite; }
    .card2-anim { animation: floatCard2 7s ease-in-out infinite 1s; }
    .stream-line { stroke-dasharray: 8 6; animation: dashMove 3s linear infinite; }
    .stream-dot { animation: pulseDot 2.5s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/>

  <!-- Background Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Ambient Dynamic Glowing Orbs (in background) -->
  <circle cx="1020" cy="70" r="140" fill="#6366f1" filter="url(#softGlow)" class="orb-anim1"/>
  <circle cx="120" cy="290" r="120" fill="#0284c7" filter="url(#softGlow)" class="orb-anim2"/>
  <circle cx="950" cy="270" r="100" fill="#c084fc" filter="url(#softGlow)" opacity="0.2"/>

  <!-- Dynamic Data Flow Lines (strictly background & right side) -->
  <g fill="none" stroke-width="2">
    <path d="M 750,290 C 860,290 890,210 990,210 S 1110,240 1190,240" stroke="#38bdf8" stroke-opacity="0.4" class="stream-line"/>
    <path d="M 780,120 C 860,120 920,80 1020,80 S 1100,140 1190,140" stroke="#818cf8" stroke-opacity="0.35" class="stream-line"/>
  </g>

  <!-- Floating Dynamic Tech Cards (Right side decorative elements) -->
  <g class="card1-anim">
    <!-- Card 1: Retail Execution Metric -->
    <rect x="910" y="55" width="230" height="90" rx="12" fill="url(#cardGrad1)" stroke="#475569" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="935" cy="85" r="12" fill="#0284c7" fill-opacity="0.3"/>
    <text x="935" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="bold">AI</text>
    <text x="958" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Store Audit &amp; Vision</text>
    <text x="958" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Planogram Accuracy 98.4%</text>
    <circle cx="1115" cy="72" r="4" fill="#10b981" class="stream-dot"/>
    <path d="M 935,124 L 970,118 L 1005,125 L 1040,112 L 1080,120 L 1115,108" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g class="card2-anim">
    <!-- Card 2: Trade Promotion & DSD -->
    <rect x="850" y="195" width="250" height="96" rx="12" fill="url(#cardGrad1)" stroke="#475569" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="875" cy="227" r="12" fill="#8b5cf6" fill-opacity="0.3"/>
    <text x="875" y="231" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c084fc" text-anchor="middle" font-weight="bold">TPM</text>
    <text x="898" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Trade Promotion &amp; DSD</text>
    <text x="898" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Route &amp; Van Sales Sync</text>
    <rect x="898" y="258" width="170" height="6" rx="3" fill="#334155"/>
    <rect x="898" y="258" width="135" height="6" rx="3" fill="url(#accentGrad)"/>
    <circle cx="1075" cy="214" r="4" fill="#38bdf8" class="stream-dot"/>
  </g>

  <!-- FOREGROUND: Clear, crisp titles and badges (never occluded) -->
  <g transform="translate(60, 50)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="280" height="30" rx="15" fill="url(#pillGrad)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="15" cy="15" r="4.5" fill="#38bdf8"/>
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="0.5">
      CURATED CPG &amp; RETAIL STACK
    </text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Consumer Goods CRM
    </text>

    <!-- Gradient Underline Accent -->
    <rect x="0" y="105" width="580" height="4" rx="2" fill="url(#accentGrad)"/>

    <!-- Subtitle -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">
      Top Retail Execution, Field Sales Automation &amp; Trade Promotion Platforms
    </text>

    <!-- Second Line Description -->
    <text x="0" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      Enterprise SaaS Solutions • Open-Source Frameworks • Van Sales &amp; DSD Route Management
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 205)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="65" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#93c5fd" text-anchor="middle">⚡ Retail Audits</text>

      <!-- Tag 2 -->
      <rect x="140" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="207" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#c4b5fd" text-anchor="middle">📊 Trade Spend (TPM)</text>

      <!-- Tag 3 -->
      <rect x="285" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="355" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6ee7b7" text-anchor="middle">🚚 Van Sales &amp; DSD</text>

      <!-- Tag 4 -->
      <rect x="435" y="0" width="150" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="510" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fbcfe8" text-anchor="middle">🔓 Open-Source Stacks</text>
    </g>
  </g>
</svg>
